name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 署名用の鍵は最初の1回だけ作り、リポジトリに保存する（更新のたびに同じ鍵で署名するため）
      - name: signing key
        run: |
          if [ ! -f contodo.jks ]; then
            keytool -genkeypair -keystore contodo.jks -alias contodo -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass contodo-key -keypass contodo-key \
              -dname "CN=ConTodo, O=ConTodo, C=JP"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add contodo.jks
            git commit -m "add signing key"
            git push
          fi

      - name: generate project
        run: python3 generate.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # APK の署名・構造を検査する（インストールできない原因の切り分け用）
      - name: inspect apk
        if: always()
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "=== build-tools: $BT ==="
            echo "=== apksigner verify ==="
            "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 || echo "apksigner exit: $?"
            echo "=== aapt2 badging ==="
            "$BT/aapt2" dump badging "$APK" 2>&1 | head -40 || true
            echo "=== zipalign ==="
            "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tail -4 || true
          } 2>&1 | tee -a build.log

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 本物のAndroidエミュレータにインストールして起動し、画面を撮る
      - name: emulator test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash emu.sh

      # 失敗の原因をあとから読めるように、ログと画面を公開しておく
      - name: publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=""
          for f in build.log emu.log crash.log detox.log shot-app.png shot-usage.png; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog $files --prerelease --title buildlog --notes "build log" || true

      - name: publish apk
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ConTodo.apk
          gh release create "build-${{ github.run_number }}" ConTodo.apk \
            --title "ConTodo ${{ github.run_number }}" \
            --notes "ConTodo Android アプリ（ウィジェット付き）" --latest
