name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 署名用の鍵は最初の1回だけ作り、リポジトリに保存する（更新のたびに同じ鍵で署名するため）
      - name: signing key
        run: |
          if [ ! -f contodo.jks ]; then
            keytool -genkeypair -keystore contodo.jks -alias contodo -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass contodo-key -keypass contodo-key \
              -dname "CN=ConTodo, O=ConTodo, C=JP"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add contodo.jks
            git commit -m "add signing key"
            git push
          fi

      - name: generate project
        run: python3 generate.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # 失敗の原因をあとから読めるように、ログを公開しておく
      - name: publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog build.log --prerelease --title buildlog --notes "build log" || true

      - name: publish apk
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ConTodo.apk
          gh release create "build-${{ github.run_number }}" ConTodo.apk \
            --title "ConTodo ${{ github.run_number }}" \
            --notes "ConTodo Android アプリ（ウィジェット付き）" --latest
